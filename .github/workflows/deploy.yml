name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: |
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/deployment.txt
      - name: Package for CapRover
        run: tar -czf /tmp/nitpick-site.tar.gz Dockerfile nginx.conf captain-definition dist
      - name: Deploy to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          npm install -g caprover
          caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --caproverApp "$CAPROVER_APP" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --tarFile /tmp/nitpick-site.tar.gz
      - name: Verify live deployment
        run: |
          for attempt in {1..30}; do
            deployed_sha=$(curl --fail --silent --show-error --max-time 10 \
              "https://nitpick.sh/deployment.txt?run=$GITHUB_RUN_ID&attempt=$attempt" || true)
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Verified deployment of $GITHUB_SHA at https://nitpick.sh"
              exit 0
            fi
            sleep 10
          done
          echo "The expected commit did not become live at https://nitpick.sh" >&2
          exit 1
