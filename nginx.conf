server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  error_page 404 /404.html;
  # Always validate notifications against the current static deployment.
  location = /deployment.txt { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /indexnow-key.txt { default_type text/plain; add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /sitemap.xml { add_header Cache-Control "no-store"; try_files $uri =404; }
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
